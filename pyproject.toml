[project]
name = "mindtrack-ai"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "PrashantByte-28", email = "prashantmishra32451@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "bcrypt>=5.0.0",
    "groq>=1.7.0",
    "numpy>=2.5.4",
    "openai>=3.35.1",
    "pandas>=3.0.6",
    "plotly>=7.1.0",
    "psycopg[binary]>=3.2",
    "pydantic>=2.14.1",
    "pytest>=9.1.1",
    "python-dotenv>=1.2.4",
    "reportlab>=5.0.1",
    "sqlalchemy>=2.1.5",
    "streamlit>=1.66.0",
]

[project.scripts]
mmindtrack-ai = "mindtrack_ai:main"

[build-system]
requires = ["uv_build>=0.12.12,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.1.1",
    "ruff>=0.17.1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
